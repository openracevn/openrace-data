name: Check races

# Design v2 (.claude/docs/design-v2.md): reads the sites in config/sites.yaml with
# their recipes, pays Firecrawl only for content that changed, and commits races +
# state in one commit.
# Plan 026, lane B: every Tuesday 08:00 in Vietnam it reads the due sites, pending
# and soonest races first, with at most 150 credits per run and the scheduled cap
# per month (scheduledMonthlyCredits in config/sites.yaml), paid reads only on
# trusted sites. The daily free refresh is refresh.yml. Manual runs (Actions tab →
# Run workflow) keep the inputs below and the full monthly cap.
on:
  schedule:
    - cron: "0 1 * * 2"
  workflow_dispatch:
    inputs:
      site:
        description: "Site key from config/sites.yaml (empty = every site that is due)"
        required: false
      race:
        description: "One race instead: race id, slug or page URL"
        required: false
      past:
        description: "Also races that already took place (backfill)"
        type: boolean
        default: false
      limit:
        description: "At most this many races per site (empty = all)"
        required: false
      max_credits:
        description: "Firecrawl credits this run may spend (about 5 per page or image read)"
        default: "250"
      free:
        description: "No paid reads: show what would be read and what it would cost"
        type: boolean
        default: false
      facts_only:
        description: "No reads at all: races from the site's free data only (prices come later)"
        type: boolean
        default: false
      dry_run:
        description: "Read and show the plan, but don't commit"
        type: boolean
        default: false

# One run at a time; a second run waits instead of reading the same pages.
concurrency:
  group: check-races
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check races
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # A PAT, not the built-in token: commits must trigger main.yml (validate + Discord).
          GITHUB_TOKEN: ${{ secrets.OPENRACE_BOT_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE: ${{ inputs.site }}
          RACE: ${{ inputs.race }}
          PAST: ${{ inputs.past }}
          LIMIT: ${{ inputs.limit }}
          MAX_CREDITS: ${{ github.event_name == 'schedule' && '150' || inputs.max_credits || '250' }}
          FREE: ${{ inputs.free }}
          FACTS_ONLY: ${{ inputs.facts_only }}
          DRY_RUN: ${{ inputs.dry_run }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          args=(--max-credits "$MAX_CREDITS")
          if [[ "$SCHEDULED" == "true" ]]; then args+=(--scheduled); fi
          if [[ -n "$SITE" ]]; then args+=(--site "$SITE"); fi
          if [[ -n "$RACE" ]]; then args+=(--race "$RACE"); fi
          if [[ -n "$LIMIT" ]]; then args+=(--limit "$LIMIT"); fi
          if [[ "$PAST" == "true" ]]; then args+=(--past); fi
          if [[ "$FREE" == "true" ]]; then args+=(--free); fi
          if [[ "$FACTS_ONLY" == "true" ]]; then args+=(--facts-only); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          npm run -s check -- "${args[@]}"
      # A red scheduled run (bad key, every site down, commit failed) says so in Discord.
      - name: Alert Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -n "$DISCORD_WEBHOOK_URL" ]] || exit 0
          jq -n --arg content ":red_circle: **Check races failed**: the weekly paid read didn't finish. ${RUN_URL}" '{content: $content}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
