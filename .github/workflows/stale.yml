name: Data digest

# Every Monday 08:00 in Vietnam (plan 026): the data's to-do list as one Discord
# message: freshness share of the upcoming races, pages pending a paid read (and
# whether Tuesday's check.yml run takes them), races that need an update-race
# session with the reason, and the month's Firecrawl credits. No page reads and no
# credits: it only reads the committed data/ and state/ files.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notify:stale
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}