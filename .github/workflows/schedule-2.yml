name: Schedule 2 (details)

# Plan 027. Daily, paid: reads every page on state/todo.json with Firecrawl (new and
# changed pages from Schedule 1; on Monday every upcoming race), so each upcoming race
# is checked every week: still on, date, location, distances, prices. Past races are
# never read. A page leaves the list once read; one that fails 3 times goes to the
# Monday digest. No per-run cap; the month's cap is scheduledMonthlyCredits in
# config/sites.yaml. Commits once, then rebuilds openrace-web once Main has synced the API.
# A scheduled Schedule 1 starts it when it finishes (one started by hand doesn't: a dry
# run there must not set off paid reads); openrace-cron (workers/cron/) dispatches it at
# 05:00 Vietnam as the fallback. A run does nothing if the list was already read today
# after the latest discovery.
on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Set by Schedule 1 or openrace-cron: a scheduled run"
        type: boolean
        default: false
      force:
        description: "Run even if the list was already read today"
        type: boolean
        default: false
      dry_run:
        description: "Read and show the plan, but don't commit (still pays for reads)"
        type: boolean
        default: false
      web_only:
        description: "Only rebuild openrace-web (no reads)"
        type: boolean
        default: false

concurrency:
  group: check-races
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      ran: ${{ steps.read.outputs.ran }}
    steps:
      # Friday 2026-10-16 is trial.yml's day (plan 027); the schedules start Saturday.
      - id: gate
        env:
          SCHEDULED: ${{ inputs.scheduled }}
          WEB_ONLY: ${{ inputs.web_only }}
        run: |
          day=$(TZ=Asia/Ho_Chi_Minh date +%F)
          go=true
          if [[ "$WEB_ONLY" == "true" ]]; then go=false; fi
          if [[ "$SCHEDULED" == "true" && "$day" == "2026-10-16" ]]; then go=false; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - name: Read the to-do list (paid)
        id: read
        if: steps.gate.outputs.go == 'true'
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENRACE_BOT_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--todo)
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          npm run -s check -- "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/run.log"
          status="${PIPESTATUS[0]}"
          if grep -q "already read the list today" "$RUNNER_TEMP/run.log" || [[ "$DRY_RUN" == "true" ]]; then echo "ran=false" >> "$GITHUB_OUTPUT"; else echo "ran=true" >> "$GITHUB_OUTPUT"; fi
          exit "$status"
      - name: Post to Discord
        if: always() && steps.gate.outputs.go == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [[ -n "$DISCORD_WEBHOOK_URL" ]] || exit 0
          log="$RUNNER_TEMP/run.log"
          if grep -q "already read the list today" "$log" 2>/dev/null; then exit 0; fi
          body=$(grep -E '^- (Sites|Reads|To-do list|Races|Commit|A paid run)' "$log" 2>/dev/null | sed 's/^- /· /' || true)
          failed=$(grep -E '^- ✗' "$log" 2>/dev/null | head -5 | sed 's/^- /· /' || true)
          msg=$(printf ':two: **Schedule 2 (details, paid reads)**: %s\n%s\n%s\n%s' "$JOB_STATUS" "${body:-no output}" "$failed" "$RUN_URL" | head -c 1990)
          jq -n --arg content "$msg" '{username: "OpenRace Data", content: $content, allowed_mentions: {parse: []}}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"

  # One site rebuild a day, after the API has the new data (plan 027): waits for Main's
  # runs on the commits above, then starts openrace-web's Deploy (repository_dispatch).
  rebuild-web:
    needs: details
    if: always() && (needs.details.outputs.ran == 'true' || inputs.web_only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 40); do
            busy=$(gh run list -R "$REPO" -w main.yml -L 10 --json status -q '[.[] | select(.status != "completed")] | length')
            [[ "$busy" == "0" ]] && exit 0
            sleep 30
          done
          echo "Main still running after 20 minutes; rebuilding anyway"
      - name: Rebuild openrace-web
        env:
          GH_TOKEN: ${{ secrets.OPENRACE_BOT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: gh api "repos/$OWNER/openrace-web/dispatches" -f event_type=data-updated
      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -n "$DISCORD_WEBHOOK_URL" ]] || exit 0
          jq -n --arg content ":red_circle: **Site rebuild not started** after Schedule 2 (OPENRACE_BOT_TOKEN needs Contents: write on openrace-web for repository_dispatch). ${RUN_URL}" '{content: $content}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
