name: Refresh races

# Plan 026, lane A: the daily free run. Every seller (ActiUp, iRace) plus the sites
# that are due are listed and snapshotted (free HTTP); unchanged pages are recorded
# as checked, changed pages get their free facts (dates, venue, sale status, "from"
# price, iRace's price table) refreshed and are marked pending a paid read, and new
# races are created from facts. 0 Firecrawl credits. One commit when anything
# changed (data/ and state/); a commit that only touches state/ doesn't run Main.
# 07:50 in Vietnam: after D1's daily write quota resets (00:30 UTC) and Main's
# backup resync (00:40 UTC). The paid read is check.yml's Tuesday cron.
on:
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show the plan, don't commit"
        type: boolean
        default: false

# Shares check.yml's group: never two runs on the same pages at once.
concurrency:
  group: check-races
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh races
        env:
          # A PAT, not the built-in token: commits must trigger main.yml (validate + Discord).
          GITHUB_TOKEN: ${{ secrets.OPENRACE_BOT_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--refresh --scheduled)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          npm run -s check -- "${args[@]}"
      # A red refresh (every site failed, or the commit failed) says so in Discord.
      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -n "$DISCORD_WEBHOOK_URL" ]] || exit 0
          jq -n --arg content ":red_circle: **Refresh races failed**: the daily free refresh didn't finish. ${RUN_URL}" '{content: $content}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
