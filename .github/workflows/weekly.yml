name: Weekly numbers

# Every Monday 08:10 in Vietnam: what OpenRace measures (plan 025), as one Discord
# message: MCP tool calls, caller keys and clients per week, and the completeness score
# against a week before. Reads openrace-mcp's public /weekly.json; no credits, no writes.
on:
  schedule:
    - cron: "10 1 * * 1"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notify:weekly
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
