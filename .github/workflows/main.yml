name: Main

# Validation runs on every push to main; the API resync and Discord notification
# only run when the push touched data/. Includes commits made by the race checker
# (check.yml commits with a PAT, so they trigger workflows; GITHUB_TOKEN pushes
# would not). Pushes that only touch the check log are skipped entirely.
# Run it by hand (Actions tab → Main → Run workflow) to resync the API without a
# commit: it validates main, then calls the API (no Discord message).
# It also runs daily at 00:40 UTC (07:40 in Vietnam), just after D1's daily write quota
# resets, as a backup: a sync that failed (quota, outage) catches up. Unchanged files
# cost the API nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
  workflow_dispatch:
  schedule:
    - cron: "40 0 * * *"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.changes.outputs.data_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        name: Detect data changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" ]] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- data/; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate

  # Tell openrace-api to resync, only once the pushed data has validated.
  # The API reads schema v2 since 2026-09-24 (openrace-api 65f6d00).
  notify-api:
    needs: [changes, validate]
    if: needs.changes.outputs.data_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the payload lists changed races from the git diff
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notify:sync
        env:
          SYNC_WEBHOOK_URL: ${{ secrets.SYNC_WEBHOOK_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}

  # Doesn't wait for validation, so a bad data push is still announced.
  notify-discord:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.data_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notify:discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
