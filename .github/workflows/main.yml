name: Main

# Validation runs on every push to main; the API resync and Discord notification
# (and a Discord alert whenever the job fails, plan 025)
# only run when the push touched data/. Includes commits made by the race checker
# (the schedules and check.yml commit with a PAT, so they trigger workflows; GITHUB_TOKEN pushes
# would not). Pushes that only touch the check log are skipped entirely.
# Run it by hand (Actions tab → Main → Run workflow) to resync the API without a
# commit: it validates main, then calls the API (no Discord message).
# No cron since plan 027: pushes start it. The resync retries a 5xx for about 7.5 minutes;
# a failed sync says so in Discord, and Schedule 2 runs Main again the next morning if
# it is still red (or run it by hand to catch up). Unchanged files cost the API nothing.
# One job on purpose: every job bills at least a minute and reinstalls dependencies,
# and data pushes are frequent. Typecheck and unit tests are skipped when a push
# only touched data/.
on:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # change detection and the notify payloads read the git diff
      - id: changes
        name: Detect changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          data=true
          code=true
          if [[ "${{ github.event_name }}" == "push" ]] && [[ ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            grep -q '^data/' <<<"$files" || data=false
            grep -qvE '^(data|state|\.claude)/|\.md$' <<<"$files" || code=false
          fi
          echo "data_changed=$data" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Doesn't wait for validation, so a bad data push is still announced. A failed
      # announcement must not stop the API resync below (2026-10-13: a Discord rate
      # limit skipped validate and Notify API for a 16-race commit).
      - name: Notify Discord
        if: github.event_name == 'push' && steps.changes.outputs.data_changed == 'true'
        continue-on-error: true
        run: npm run notify:discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}

      - name: Typecheck and test
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          npm run typecheck
          npm test
      - run: npm run validate

      # Tell openrace-api to resync, only once the pushed data has validated.
      # The API reads schema v2 since 2026-09-24 (openrace-api 65f6d00).
      - name: Notify API
        if: steps.changes.outputs.data_changed == 'true'
        run: npm run notify:sync
        env:
          SYNC_WEBHOOK_URL: ${{ secrets.SYNC_WEBHOOK_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}

      # Plan 025: a red Main (typecheck, tests, validate or the API resync) says so in
      # Discord, so a failed sync never goes unnoticed. Skipped when the secret is unset.
      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          [[ -n "$DISCORD_WEBHOOK_URL" ]] || exit 0
          msg=":red_circle: **Main failed** on \`main\` (${EVENT}, ${SHA:0:7}): validate or the API resync didn't pass (a failed resync is retried by tomorrow's Schedule 2). ${RUN_URL}"
          jq -n --arg content "$msg" '{content: $content}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
