# Fixed places OpenRace measures from (plan 003). There is no user location: one list
# serves both "near X" (?near=) and "distance from X" (?fromPlace=, geo.fromPlaces).
#
# id:       stable key, used in race files (geo.fromPlaces) and the API
# name:     as people say it
# center:   [lat, lng]: the point distances are measured from (a landmark in the centre)
# radiusKm: a race within this straight-line distance of the center is "near"
# legacy:   old units (before 1/7/2025) that also count as near, by official code, so
#           names people still use ("Nha Trang", "Vũng Tàu") keep working after the merger
#
# Drafted by Claude Code on 2026-09-24 (plan 004 stage C); not yet reviewed by the user.

places:
  - id: hcmc
    name: TP. Hồ Chí Minh
    center: [10.7725, 106.6980] # Bến Thành market, District 1
    radiusKm: 30
    legacy: { districts: ["760"] } # Quận 1

  - id: ha-noi
    name: Hà Nội
    center: [21.0285, 105.8522] # Hoàn Kiếm lake
    radiusKm: 30
    legacy: { districts: ["002"] } # Quận Hoàn Kiếm

